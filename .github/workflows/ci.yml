name: 持续集成

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成版本文件
        run: npm run version

      - name: 类型检查
        run: npm run typecheck

      - name: 格式检查
        run: npm run format:check

      - name: 回归测试
        run: npm test

      - name: 构建
        run: npm run build
